<path id="loop-R" d="M 458.3 305.5 A 25 25 0 1 1 458.3 330.5" fill="none" stroke="#d81e1e" stroke-width="2"/>
<polygon id="loop-head-R" points="458.3,330.5 467.7,337.8 460.0,342.3" fill="#d81e1e"/>
<text id="loop-letter-R" x="480" y="326" font-size="22" fill="#d81e1e" text-anchor="middle">R</text>
<text x="52" y="660" font-size="12.5" fill="#000000">a slow loop: quality slips monthly, workarounds accumulate quietly, and the reports that would close it thin as it turns</text>
<text x="52" y="677" font-size="12.5" fill="#000000">monitoring is not drawn: tuned to outages, it does not carry a monthly loss of trustworthiness</text>
<text x="52" y="694" font-size="12.5" fill="#000000">grey: degraded answers keep advising decisions, and no evidenced effect returns from decisions to the loop</text>
<line x1="52" y1="716" x2="110" y2="716" stroke="#000000" stroke-width="1.5"/>
<polygon points="110,716 97,711 97,721" fill="#000000"/>
<text x="127" y="720" font-size="11" fill="#000000">natural effect, same direction</text>
