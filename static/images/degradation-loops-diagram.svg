<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="Helvetica, Arial, sans-serif">
<title>Quietly worse, and no ticket says so</title>
<desc>A reinforcing loop closes between answer quality, workaround use, problem reports and corrective effort: as quality slips the loop turns towards further slipping, month by month. One grey branch leaves the loop and does not return. Drawn as clouds, meaning measurable but not measured: answer quality, workaround use and corrective effort. Drawn in grey, meaning a sourced effect on a branch with no evidenced return: the quality of decisions taken on answers. An increase in answer quality lowers workaround use, by human intervention. An increase in workaround use lowers problem reports, by human intervention. An increase in problem reports raises corrective effort, by human intervention. An increase in corrective effort raises answer quality. An increase in answer quality raises the quality of decisions taken on answers.</desc>
<rect id="background" width="960" height="780" fill="#ffffff"/>
<text id="title" x="480" y="38" font-size="20" fill="#000000" text-anchor="middle">Quietly worse, and no ticket says so</text>
<text id="subtitle" x="480" y="60" font-size="13" fill="#000000" text-anchor="middle">One reinforcing loop: answer quality, workarounds, reports, repair</text>
