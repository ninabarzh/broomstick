<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="Helvetica, Arial, sans-serif">
<title>The tool that feeds its own queue</title>
<desc>A reinforcing loop closes between queries asked, generated text and questions arising: each answer becomes text, the text raises questions, and the questions come back as queries, at the speed of asking. No edge in the loop passes through a decision, and no sourced effect returns from one. Drawn as clouds, meaning measurable but not measured: generated text and questions arising. Drawn in grey, meaning a sourced effect on a branch with no evidenced return: reading load. An increase in queries asked raises generated text. An increase in generated text raises questions arising. An increase in questions arising raises queries asked, by human intervention. An increase in generated text raises reading load.</desc>
<rect id="background" width="960" height="780" fill="#ffffff"/>
<text id="title" x="480" y="38" font-size="20" fill="#000000" text-anchor="middle">The tool that feeds its own queue</text>
<text id="subtitle" x="480" y="60" font-size="13" fill="#000000" text-anchor="middle">One reinforcing loop, and the reading that leaves it</text>
<ellipse id="node-q" cx="480" cy="150" rx="70" ry="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text id="text-q-1" x="480" y="154" font-size="13.5" fill="#000000" text-anchor="middle">queries asked</text>
