<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" font-family="Georgia, 'Times New Roman', serif">
  <rect width="840" height="500" fill="#f6f2e7"/>
  <rect x="18" y="18" width="804" height="464" fill="none" stroke="#2a2520" stroke-width="2"/>
  <rect x="24" y="24" width="792" height="452" fill="none" stroke="#2a2520" stroke-width="0.75"/>

  <!-- column headers -->
  <text x="230" y="72" font-size="17" fill="#8a8172" letter-spacing="4" text-anchor="middle">THE ARCHIVE</text>
  <text x="610" y="72" font-size="17" fill="#8a8172" letter-spacing="4" text-anchor="middle">THE ORACLE</text>
  <line x1="60" y1="92" x2="780" y2="92" stroke="#2a2520" stroke-width="1.5"/>

  <!-- row separators -->
  <g stroke="#d9d1bd" stroke-width="1">
    <line x1="60" y1="172" x2="780" y2="172"/>
    <line x1="60" y1="252" x2="780" y2="252"/>
    <line x1="60" y1="332" x2="780" y2="332"/>
  </g>
  <line x1="60" y1="412" x2="780" y2="412" stroke="#2a2520" stroke-width="1.5"/>

  <!-- swap arrows -->
  <g stroke="#a33b2e" stroke-width="2.5" opacity="0.8">
    <g id="swap">
      <line x1="396" y1="126" x2="438" y2="126"/>
      <path d="M 438 126 l -9 -5 v 10 z" fill="#a33b2e" stroke="none"/>
      <line x1="444" y1="138" x2="402" y2="138"/>
      <path d="M 402 138 l 9 -5 v 10 z" fill="#a33b2e" stroke="none"/>
    </g>
    <use href="#swap" y="80"/>
    <use href="#swap" y="160"/>
    <use href="#swap" y="240"/>
  </g>

  <!-- rows -->
  <g font-size="16" fill="#2a2520">
    <text x="70" y="126">preserves evidence,</text>
    <text x="70" y="149" fill="#5a5348">drafts, dissents, versions that lost</text>
    <text x="470" y="126">produces answers,</text>
    <text x="470" y="149" fill="#5a5348">the evidence digested out of sight</text>

    <text x="70" y="206">exposes disagreement,</text>
    <text x="70" y="229" fill="#5a5348">contradictions sit side by side</text>
    <text x="470" y="206">hides disagreement,</text>
    <text x="470" y="229" fill="#5a5348">resolved inside a single voice</text>

    <text x="70" y="286">requires interpretation,</text>
    <text x="70" y="309" fill="#5a5348">a person and a judgement in the loop</text>
    <text x="470" y="286">supplies the interpretation,</text>
    <text x="470" y="309" fill="#5a5348">instead of requiring one</text>

    <text x="70" y="366">reach bounded,</text>
    <text x="70" y="389" fill="#5a5348">by permissions, findability, patience</text>
    <text x="470" y="366">reach expanding,</text>
    <text x="470" y="389" fill="#5a5348">with every connector added</text>
  </g>

  <!-- footer -->
  <text x="60" y="448" font-size="13.5" fill="#5a5348" font-style="italic">Traded at deployment, unannounced.</text>
</svg>
