<text x="127" y="748" font-size="11" fill="#000000">human intervention, same direction</text>
<line x1="500" y1="716" x2="558" y2="716" stroke="#000000" stroke-width="1.5"/>
<polygon points="558,716 545,711 545,721" fill="#000000"/>
<rect x="522.5" y="709.5" width="13" height="13" fill="#000000"/>
<text x="575" y="720" font-size="11" fill="#000000">human intervention, opposite direction</text>
<line x1="500" y1="744" x2="558" y2="744" stroke="#8c8c8c" stroke-width="1.5"/>
<polygon points="558,744 545,739 545,749" fill="#8c8c8c"/>
<text x="575" y="748" font-size="11" fill="#8c8c8c">grey: sourced effect on a branch with no evidenced return</text>
</svg>
